[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verify-api-mcp"
version = "0.3.0"
description = "MCP server for Verify API -- evidence-backed citation, URL, package, repo, and case verification for agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mick Goodson" }]
dependencies = ["httpx>=0.27", "mcp>=1.2"]

[project.urls]
Homepage = "https://goodsong.dev"
Repository = "https://github.com/mgdsn/verify-api-mcp"

[project.scripts]
verify-api-mcp = "verify_api_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verify_api_mcp"]
